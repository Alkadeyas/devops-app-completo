spring.application.name=devops-app

# ---------------------------------------------------------------------------
# Spring Boot Actuator
# L'endpoint /health e' fornito da Actuator: nessun controller custom.
# Di default sarebbe esposto su /actuator/health; spostiamo la base path a "/"
# per averlo direttamente su /health.
# ---------------------------------------------------------------------------
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Dati mostrati sull'endpoint /info
management.info.env.enabled=true
info.app.name=devops-app
info.app.description=API di esempio del corso DevOps per Junior


spring.datasource.url=jdbc:postgresql://localhost:5432/devops
spring.datasource.username=devops
spring.datasource.password=devops

spring.datasource.hikari.connection-timeout=3000