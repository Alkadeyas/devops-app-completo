services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devops
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devops"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - devops-network

  app:
    build:
      context: .
      dockerfile: Dockerfile_v2
    image: lezione4:v2
    ports:
      - 8082:8080
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/devops
      SPRING_DATASOURCE_USERNAME: devops
      SPRING_DATASOURCE_PASSWORD: devops
    networks:
      - devops-network
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:

networks:
  devops-network: